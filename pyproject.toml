[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-ai-review"
version = "0.1.0"
description = "Run bounded, parallel adversarial reviews with multiple AI CLIs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "j2h4u" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
cross-ai = "cross_ai:main"

[tool.setuptools]
py-modules = ["cross_ai"]
